
<!DOCTYPE html>
<head>
    <title>Home Page</title>
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='styles/style.css') }}">

</head>

<body>

    <style>
        body{
            background-color: rgba(173, 216, 230, 1);
    
        }
    </style>

<header>
    <div class="navbar">
        <div class="navbar-logo">
            <a href="{{ url_for('home_page') }}" alt="Rolsa Logo (Home Button)" title="Home Button (Rolsa Logo)">Rolsa</a>
        </div>
        
            <ul class="navbar-items">
                <li><a href="{{ url_for('energy_usage') }}" alt="Energy Usage Button">Energy Usage</li>
                <li><a href="{{ url_for('carbon_footprint') }}" alt="Carbon Footprint Button">Carbon Footprint</li>
                <li><a href="{{ url_for('installations_and_consultations') }}" alt="Energy Usage Button">Installations and Consultations</li>
                <li><a href="{{ url_for('green_energy_products') }}" alt="Green Energy Products Button">Green Energy Prodcuts</li>
            </ul>
            {% if logged_in %}
            <div class="navbar-login">
                <a class="button" href="{{ url_for('account') }}" alt="Account Button">Account</a>
            </div>
            {% else %}
            <div class="navbar-login">
                <a class="button" href="{{ url_for('log_in') }}" alt="Log In Button">Log In</a>
            </div>
            {% endif %}
        </div>
    </div>
</header>



<div class="account-form">
    <H1>Rolsa Technologies</H1>
    <h2>Billing Information</h2>
    <form action="/sign-up" method="post">

        <label for="cardholder-name">
            Cardholder name:
        </label>
        <input type="text" id="cardholder-name" name="cardholder-name" placeholder="Enter cardholder name" required>

        <label for="card-number">
            Card Number:
        </label>
        <input type="text" id="card-number" name="card-number" placeholder="Enter your surname" required>

        <label for="cvc">
            cvc
        </label>
        <input type="text" id="cvc" name="cvc" placeholder="Enter your cvc" required>

        <label for="password">
            Expiry date
        </label>
        <input type="text" id="expiry-date" placeholder="MM/YY" maxlength="5">

        {% if error %}
        <p style="color:rgb(255,0,0);">{{error}}</p>
        {% endif %}
        <div class="wrap-button">
            <button type="sign-up">
                Book now
            </button>
        </div>
    </form>

    <script>
        const expiryInput = document.getElementById('expiry-date');

        expiryInput.addEventListener('input', function (e) {
            let value = e.target.value;

            // Remove any non-digit and non-slash characters
            value = value.replace(/[^\d\/]/g, '');

            // Automatically insert a slash after typing two digits for the month
            if (value.length === 2 && !value.includes('/')) {
                value = value + '/';
            }

            // Restrict length to MM/YY
            if (value.length > 5) {
                value = value.slice(0, 5);
            }

            e.target.value = value;
        });
    </script>

</div>
