<div class="back-to-product-button">
    <a href="/green-energy-products">Back to Products</a>
</div>
<div class="product-info-wrapper">
    <div class="product-info-details">
        <form action="/booking/{{ product[0] }}" method="post">
            <img src="{{ product[3] }}" alt="{{ product[1] }}">
            <div class="content">
                <div class="text">
                    <h1>{{ product[1] }}</h1>
                    <p>{{ product[2] }}</p>
                    <p>Installation Price: {{ product[4] }}</p>
                    <p>Consultation Price: {{ product[5] }}</p>
                </div>
                <div class="buttons">
                    <!-- Hidden field to pass product[0] -->
                    <input type="hidden" name="product_id" value="{{ product[0] }}">
                    <!-- Button for scheduling installation -->
                    <button type="submit" name="consultation_or_installation" value="installation">Schedule Installation</button>
                    <!-- Button for scheduling consultation -->
                    <button type="submit" name="consultation_or_installation" value="consultation">Schedule Consultation</button>
                </div>
            </div>
        </form>
    </div>


</div>
